<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>픽티업 · Pick Tea Up</title>
    <meta name="description" content="차가 어려운 사람들을 위한 차 추천·기록 앱 — 픽티업 with 핑티" />
    <meta property="og:title" content="픽티업 with 핑티" />
    <meta property="og:description" content="오늘 기분만 말하면 핑티가 차를 골라줘요. 마신 잔은 찻장에 남아요." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet" />
    <link rel="preload" as="image" href="/illustrations/logo-line.png" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="픽티업" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" id="manifest-link" />
    <meta name="theme-color" content="#F4EFE4" />
    <meta name="mobile-web-app-capable" content="yes" />
    <script>
      // 기기 언어가 한국어가 아니면 영문 manifest로 교체 → 홈 화면 이름 "Pick Tea Up"
      (function () {
        var lang = (navigator.language || '').toLowerCase();
        if (!lang.startsWith('ko')) {
          document.getElementById('manifest-link').setAttribute('href', '/manifest.en.webmanifest');
          document.querySelector('meta[name="apple-mobile-web-app-title"]').setAttribute('content', 'Pick Tea Up');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
